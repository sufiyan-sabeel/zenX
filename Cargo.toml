[workspace]
resolver = "2"
members = [
    "crates/zenx-core",
    "crates/zenx-storage",
    "crates/zenx-security",
    "crates/zenx-trace",
    "crates/zenx-skills",
    "crates/zenx-doctor",
    "crates/zenx-mobile",
    "crates/zenx-bench",
    "crates/zenx-contract",
    "crates/zenx-docs",
    "crates/zenx-selfupdate",
    "crates/zenx-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/sufiyan-sabeel/zenX"
authors = ["Umaiz Sufiyan"]
homepage = "https://github.com/sufiyan-sabeel/zenX"

[workspace.dependencies]
zenx-core = { path = "crates/zenx-core", version = "0.1.0" }
zenx-storage = { path = "crates/zenx-storage", version = "0.1.0" }
zenx-security = { path = "crates/zenx-security", version = "0.1.0" }
zenx-trace = { path = "crates/zenx-trace", version = "0.1.0" }
zenx-skills = { path = "crates/zenx-skills", version = "0.1.0" }
zenx-doctor = { path = "crates/zenx-doctor", version = "0.1.0" }
zenx-mobile = { path = "crates/zenx-mobile", version = "0.1.0" }
zenx-bench = { path = "crates/zenx-bench", version = "0.1.0" }
zenx-contract = { path = "crates/zenx-contract", version = "0.1.0" }
zenx-docs = { path = "crates/zenx-docs", version = "0.1.0" }
zenx-selfupdate = { path = "crates/zenx-selfupdate", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
regex = "1"
walkdir = "2"
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
