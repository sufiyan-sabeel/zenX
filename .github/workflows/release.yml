name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cross linker for aarch64 linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -eu
          name="zenx-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/zenx" "dist/$name/"
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - name: package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "zenx-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/zenx.exe" "dist/$name/"
          Copy-Item README.md,LICENSE,CHANGELOG.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - name: checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt 2>/dev/null || shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  verify-installer:
    name: install from the built artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: assemble the download directory
        run: |
          set -eu
          mkdir -p dist
          cp artifacts/dist-x86_64-unknown-linux-gnu/*.tar.gz dist/
          ( cd dist && sha256sum *.tar.gz > SHA256SUMS.txt )
      - name: install with the shipped script
        run: |
          set -eu
          ZENX_RELEASE_BASE_URL="file://$PWD/dist" ./install.sh --dir "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/zenx" --version
      - name: the installed binary verifies an update from the same artifacts
        run: |
          set -eu
          ZENX_HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/bin/zenx" init
          # --version skips the "is it newer" gate, so this exercises the real
          # download + SHA-256 verification path without replacing the binary.
          ZENX_RELEASE_BASE_URL="file://$PWD/dist" ZENX_HOME="$RUNNER_TEMP/home" \
            "$RUNNER_TEMP/bin/zenx" update --version v9.9.9 --dry-run --output json \
            > "$RUNNER_TEMP/update.json"
          grep -q '"verified": true' "$RUNNER_TEMP/update.json"
          grep -q '"action": "verified"' "$RUNNER_TEMP/update.json"

  release:
    name: publish release
    needs: [build, verify-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: collect
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/ \;
          cp install.sh install.ps1 dist/
          cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            zenX ${{ github.ref_name }}

            Every archive below was built by this workflow from the tagged commit.
            Verify the download with `sha256sum -c SHA256SUMS.txt` before installing,
            or let the installer do it for you:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/sufiyan-sabeel/zenX/main/install.sh | sh
            ```

            Install on Linux or Termux:

            ```bash
            curl -fsSLO https://github.com/sufiyan-sabeel/zenX/releases/download/${{ github.ref_name }}/zenx-aarch64-unknown-linux-gnu.tar.gz
            tar -xzf zenx-aarch64-unknown-linux-gnu.tar.gz
            install -m 755 zenx-aarch64-unknown-linux-gnu/zenx "$PREFIX/bin/zenx"
            ```
