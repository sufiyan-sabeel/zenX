openapi: 3.0.0
info:
  title: Orders API
  version: 2.0.0
paths:
  /orders:
    get:
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
        - name: cursor
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: a list of orders
          content:
            application/json:
              schema:
                type: object
    post:
      responses:
        "201":
          description: created
  /orders/{id}/items:
    get:
      responses:
        "200":
          description: order items
